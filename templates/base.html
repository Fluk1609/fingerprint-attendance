<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ระบบสแกนลายนิ้วมือ{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
</head>

<body>
  <header class="topbar">
    <div class="brand"> ระบบสแกนลายนิ้วมือ</div>
    <nav>
      <a href="{{ url_for('check_in') }}" class="{{ 'active' if request.path == '/' }}">เช็คชื่อ</a>
      <a href="{{ url_for('users_page') }}" class="{{ 'active' if request.path.startswith('/users') }}">ผู้ใช้งาน</a>
      <a href="{{ url_for('sections_page') }}"
        class="{{ 'active' if request.path.startswith('/sections') }}">กลุ่มเรียน</a>
      <a href="{{ url_for('subjects_page') }}"
        class="{{ 'active' if request.path.startswith('/subjects') }}">วิชา</a>
      <a href="{{ url_for('reports_page') }}" class="{{ 'active' if request.path.startswith('/reports') }}">รายงาน</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>

</html>
